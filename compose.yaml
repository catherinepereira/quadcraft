name: quadcraft

services:
  dashboard:
    build:
      context: .
      target: dashboard
    ports:
      - "127.0.0.1:5318:5318"
    volumes:
      - ./dashboard/src:/app/src
    extra_hosts:
      - "host.docker.internal:host-gateway"

  train:
    build:
      context: .
      target: train
    # the training folder is mounted, so data, checkpoints, and reports land on the host
    volumes:
      - ./training:/repo/training
      - ./mod:/repo/mod:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    shm_size: 2gb
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
